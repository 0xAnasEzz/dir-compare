<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <!-- Container Background (Matches GitHub Native Dark Surface) -->
  <rect x="2" y="2" width="1196" height="376" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: BRAND & VALUE ==================== -->
  <g transform="translate(48, 44)">

    <!-- Top Tag Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#388bfd"/>
      <text x="24" y="15.5"
            font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="10.5"
            font-weight="700"
            fill="#58a6ff"
            letter-spacing="1">POSIX BASH 4+</text>
    </g>

    <!-- Main Title with Integrated Mini Icon -->
    <g transform="translate(0, 36)">
      <!-- Mini Geometric Folders Badge -->
      <g transform="translate(0, 4)">
        <rect x="0" y="0" width="46" height="46" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <!-- Mini Left Folder (Blue) -->
        <path d="M 8 18 C 8 16 10 14 12 14 L 18 14 L 21 17 L 27 17 C 29 17 31 19 31 21 L 31 34 C 31 36 29 37 27 37 L 12 37 C 10 37 8 36 8 34 Z" fill="#2563eb" opacity="0.9"/>
        <!-- Mini Right Folder (Green) -->
        <path d="M 16 20 C 16 18 18 16 20 16 L 26 16 L 29 19 L 35 19 C 37 19 39 21 39 23 L 39 36 C 39 38 37 39 35 39 L 20 39 C 18 39 16 38 16 36 Z" fill="#059669"/>
        <!-- Mini Equal Sign in Center -->
        <line x1="21" y1="27" x2="27" y2="27" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="21" y1="31" x2="27" y2="31" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      </g>

      <!-- Main Project Title -->
      <text x="60" y="40"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="44"
            font-weight="800"
            fill="#f0f6fc"
            letter-spacing="-1">dir-compare</text>
    </g>

    <!-- Subtitle -->
    <text x="2" y="122"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="18"
          font-weight="600"
          fill="#c9d1d9">
      Decoupled Directory Hashing &amp; Verification
    </text>

    <!-- Clear, Human Product Description -->
    <g transform="translate(2, 152)"
       font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
       font-size="13.5"
       fill="#8b949e">
      <text x="0" y="0">Guarantee bit-for-bit file integrity during device migrations.</text>
      <text x="0" y="22">Generate portable manifests on source, verify offline on target</text>
      <text x="0" y="44">without mounting both filesystems side-by-side.</text>
    </g>

    <!-- Developer-Centric Feature Badges (Flat, Clean, No Emojis) -->
    <g transform="translate(0, 238)">
      <!-- Badge 1: Android / Termux -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="124" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="62" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">Android / Termux</text>
      </g>

      <!-- Badge 2: MD5 & SHA-256 -->
      <g transform="translate(132, 0)">
        <rect x="0" y="0" width="122" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="61" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">MD5 &amp; SHA-256</text>
      </g>

      <!-- Badge 3: 4-Way Diff Set -->
      <g transform="translate(262, 0)">
        <rect x="0" y="0" width="108" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="54" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">4-Way Diff Set</text>
      </g>

      <!-- Badge 4: Zero Dependencies -->
      <g transform="translate(378, 0)">
        <rect x="0" y="0" width="112" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="56" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">POSIX Coreutils</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: AUTHENTIC CLI WORKFLOW ==================== -->
  <g transform="translate(564, 32)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="588" height="316" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- Terminal Window Bar -->
    <path d="M 0 10 C 0 4.48 4.48 0 10 0 L 578 0 C 583.52 0 588 4.48 588 10 L 588 34 L 0 34 Z" fill="#21262d"/>
    <line x1="0" y1="34" x2="588" y2="34" stroke="#30363d" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="18" cy="17" r="4.5" fill="#ff5f56" opacity="0.85"/>
    <circle cx="34" cy="17" r="4.5" fill="#ffbd2e" opacity="0.85"/>
    <circle cx="50" cy="17" r="4.5" fill="#27c93f" opacity="0.85"/>

    <!-- Window Title -->
    <text x="294" y="21" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="500" text-anchor="middle">
      bash — dir-compare workflow
    </text>

    <!-- Terminal Content (Real, Clean Developer CLI Session) -->
    <g transform="translate(20, 52)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">

      <!-- STEP 1: HASH -->
      <text x="0" y="12" fill="#6e7681"># 1. On source device (Old Phone / Server)</text>

      <text x="0" y="32">
        <tspan fill="#58a6ff" font-weight="700">$</tspan>
        <tspan fill="#f0f6fc"> dir-compare hash /sdcard/DCIM</tspan>
      </text>

      <text x="0" y="52" fill="#8b949e">
        <tspan fill="#3fb950">✓</tspan>
        <tspan fill="#8b949e"> Scanned 4,821 files in 32 directories</tspan>
      </text>
      <text x="0" y="70" fill="#8b949e">
        <tspan fill="#3fb950">✓</tspan>
        <tspan fill="#8b949e"> Manifest generated: </tspan>
        <tspan fill="#79c0ff">./dir-hashes/DCIM.md5</tspan>
      </text>

      <!-- STEP 2: VERIFY -->
      <text x="0" y="104" fill="#6e7681"># 2. Transfer manifest &amp; verify on destination</text>

      <text x="0" y="124">
        <tspan fill="#58a6ff" font-weight="700">$</tspan>
        <tspan fill="#f0f6fc"> dir-compare verify /sdcard/DCIM DCIM.md5</tspan>
      </text>

      <!-- Divider Line -->
      <line x1="0" y1="140" x2="548" y2="140" stroke="#30363d" stroke-width="1"/>

      <!-- Audit Stats -->
      <g transform="translate(0, 158)">
        <text x="12" y="0" fill="#8b949e">Perfect Matches</text>
        <text x="210" y="0" fill="#3fb950" font-weight="700">4,821</text>
        <text x="260" y="0" fill="#3fb950">(100% bit-for-bit)</text>

        <text x="12" y="18" fill="#8b949e">Signature Mismatches</text>
        <text x="210" y="18" fill="#8b949e">0</text>
        <text x="260" y="18" fill="#6e7681">(None)</text>

        <text x="12" y="36" fill="#8b949e">Missing / Extra Files</text>
        <text x="210" y="36" fill="#8b949e">0 / 0</text>
        <text x="260" y="36" fill="#6e7681">(None)</text>
      </g>

      <!-- Divider Line -->
      <line x1="0" y1="212" x2="548" y2="212" stroke="#30363d" stroke-width="1"/>

      <!-- Terminal Result Bar -->
      <g transform="translate(0, 226)">
        <text x="12" y="12" fill="#3fb950" font-weight="700">
          <tspan fill="#3fb950">✓</tspan>
          <tspan fill="#f0f6fc"> OVERALL STATUS : </tspan>
          <tspan fill="#3fb950">SUCCESS (100% Identical Trees)</tspan>
        </text>
      </g>

    </g>
  </g>
</svg>
