<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Base Background Card (GitHub Dark Surface) -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- ==================== LEFT FOLDER (SOURCE / HASH) ==================== -->
  <g id="source-folder">
    <!-- Back Tab & Plate -->
    <path d="M 72 172 C 72 162 80 154 90 154 L 142 154 C 148 154 154 158 158 163 L 170 178 L 224 178 C 230 178 234 182 234 188 L 234 326 C 234 336 226 344 216 344 L 90 344 C 80 344 72 336 72 326 Z"
          fill="#1d4ed8"/>

    <!-- Manifest Document (Paper sticking out) -->
    <g transform="translate(90, 116)">
      <rect x="0" y="0" width="124" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Sheet Code Lines -->
      <rect x="14" y="16" width="48" height="4.5" rx="2" fill="#94a3b8"/>
      <rect x="14" y="27" width="96" height="4" rx="2" fill="#e2e8f0"/>
      <!-- Bold Cryptographic Hash Glyph '#' (Centered & fully visible above pocket) -->
      <text x="62" y="68"
            font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="44"
            font-weight="900"
            fill="#2563eb"
            text-anchor="middle">#</text>
    </g>

    <!-- Front Pocket Flap -->
    <path d="M 64 196 C 64 186 72 178 82 178 L 236 178 C 246 178 254 186 254 196 L 254 334 C 254 344 246 352 236 352 L 82 352 C 72 352 64 344 64 334 Z"
          fill="#2563eb"/>
    <!-- Top Pocket Edge Highlight -->
    <line x1="82" y1="179" x2="236" y2="179" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

    <!-- Source Label Pill on Front Pocket -->
    <rect x="100" y="252" width="82" height="24" rx="6" fill="#1d4ed8"/>
    <text x="141" y="268"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11.5"
          font-weight="700"
          fill="#bfdbfe"
          letter-spacing="1"
          text-anchor="middle">SOURCE</text>
  </g>

  <!-- ==================== RIGHT FOLDER (TARGET / VERIFIED) ==================== -->
  <g id="target-folder">
    <!-- Back Tab & Plate -->
    <path d="M 278 188 C 278 182 282 178 288 178 L 342 178 L 354 163 C 358 158 364 154 370 154 L 422 154 C 432 154 440 162 440 172 L 440 326 C 440 336 432 344 422 344 L 296 344 C 286 344 278 336 278 326 Z"
          fill="#047857"/>

    <!-- Verified Document (Paper sticking out) -->
    <g transform="translate(298, 116)">
      <rect x="0" y="0" width="124" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Sheet Code Lines -->
      <rect x="14" y="16" width="48" height="4.5" rx="2" fill="#94a3b8"/>
      <rect x="14" y="27" width="96" height="4" rx="2" fill="#e2e8f0"/>
      <!-- Bold Verified Checkmark '✓' (Centered & fully visible above pocket) -->
      <path d="M 44 54 L 57 67 L 82 40"
            fill="none"
            stroke="#059669"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Front Pocket Flap -->
    <path d="M 258 196 C 258 186 266 178 276 178 L 430 178 C 440 178 448 186 448 196 L 448 334 C 448 344 440 352 430 352 L 276 352 C 266 352 258 344 258 334 Z"
          fill="#059669"/>
    <!-- Top Pocket Edge Highlight -->
    <line x1="276" y1="179" x2="430" y2="179" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

    <!-- Target Label Pill on Front Pocket -->
    <rect x="312" y="252" width="82" height="24" rx="6" fill="#047857"/>
    <text x="353" y="268"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11.5"
          font-weight="700"
          fill="#a7f3d0"
          letter-spacing="1"
          text-anchor="middle">TARGET</text>
  </g>

  <!-- ==================== CENTRAL COMPARISON LINK ==================== -->
  <!-- Horizontal Connecting Bridge Bar -->
  <line x1="200" y1="264" x2="312" y2="264" stroke="#0d1117" stroke-width="16" stroke-linecap="round"/>
  <line x1="200" y1="264" x2="312" y2="264" stroke="#30363d" stroke-width="5" stroke-linecap="round"/>

  <!-- Center Equality Badge Disc -->
  <circle cx="256" cy="264" r="42" fill="#161b22" stroke="#484f58" stroke-width="3"/>

  <!-- Bold Mathematical Equality Sign '==' -->
  <line x1="238" y1="255" x2="274" y2="255" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="238" y1="273" x2="274" y2="273" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Bottom Brand Status -->
  <text x="256" y="416"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="13"
        font-weight="700"
        fill="#8b949e"
        letter-spacing="3"
        text-anchor="middle">BIT-FOR-BIT VERIFIED</text>
</svg>
