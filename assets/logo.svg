<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Source / Left Folder Gradients (Cyan) -->
    <linearGradient id="cyanBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyanFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="cyanSheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Target / Right Folder Gradients (Emerald) -->
    <linearGradient id="emeraldBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="emeraldFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="emeraldSheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Central Shield & Check Gradients -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowLeft" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="256" r="160" fill="url(#glowLeft)" />
  <circle cx="352" cy="256" r="160" fill="url(#glowRight)" />

  <!-- Tech Grid Accent Lines -->
  <g opacity="0.07" stroke="#f8fafc" stroke-width="1.2" stroke-dasharray="4 8">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Top Pill / Terminal Tag -->
  <g transform="translate(176, 52)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="14" r="3.5" fill="#38bdf8" />
    <text x="94" y="18" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="middle">DIR-COMPARE</text>
  </g>

  <!-- ==================== LEFT FOLDER (SOURCE / HASH) ==================== -->
  <g filter="url(#shadow)">
    <!-- Back Plate & Tab -->
    <path d="M 88 168 C 88 156 98 146 110 146 L 168 146 C 176 146 183 150 188 156 L 202 174 L 236 174 C 248 174 256 182 256 192 L 256 352 C 256 364 246 374 234 374 L 110 374 C 98 374 88 364 88 352 Z"
          fill="url(#cyanBack)" />

    <!-- Manifest Data Sheet (Inside Folder) -->
    <g transform="translate(106, 130)">
      <rect x="0" y="0" width="116" height="130" rx="8" fill="url(#cyanSheet)" opacity="0.95" />
      <!-- Manifest Header Pill -->
      <rect x="12" y="14" width="46" height="7" rx="3.5" fill="#0369a1" />
      <circle cx="88" cy="17.5" r="4.5" fill="#0284c7" />
      <!-- Checksum Code Lines -->
      <rect x="12" y="32" width="92" height="4" rx="2" fill="#0284c7" opacity="0.75" />
      <rect x="12" y="44" width="76" height="4" rx="2" fill="#0369a1" opacity="0.5" />
      <rect x="12" y="56" width="86" height="4" rx="2" fill="#0284c7" opacity="0.75" />
      <rect x="12" y="68" width="60" height="4" rx="2" fill="#0369a1" opacity="0.5" />
      <!-- Hash Icon Mini Badge -->
      <rect x="12" y="84" width="38" height="16" rx="4" fill="#0284c7" />
      <text x="31" y="96" fill="#ffffff" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="800" text-anchor="middle">#MD5</text>
    </g>

    <!-- Front Pocket / Angled Cover -->
    <path d="M 80 206 C 80 194 90 184 102 184 L 228 184 C 238 184 246 191 249 200 L 258 232 L 258 354 C 258 366 248 376 236 376 L 102 376 C 90 376 80 366 80 354 Z"
          fill="url(#cyanFront)" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Sleek Front Pocket Highlight Reflection -->
    <path d="M 82 208 L 226 186 C 234 186 242 192 244 200 L 246 226 L 82 240 Z"
          fill="#ffffff" opacity="0.12" />
  </g>

  <!-- ==================== RIGHT FOLDER (TARGET / VERIFIED) ==================== -->
  <g filter="url(#shadow)">
    <!-- Back Plate & Tab -->
    <path d="M 256 192 C 256 182 264 174 276 174 L 310 174 L 324 156 C 329 150 336 146 344 146 L 402 146 C 414 146 424 156 424 168 L 424 352 C 424 364 414 374 402 374 L 278 374 C 266 374 256 364 256 352 Z"
          fill="url(#emeraldBack)" />

    <!-- Verified Target Sheet (Inside Folder) -->
    <g transform="translate(290, 130)">
      <rect x="0" y="0" width="116" height="130" rx="8" fill="url(#emeraldSheet)" opacity="0.95" />
      <!-- Target Header Pill -->
      <rect x="12" y="14" width="46" height="7" rx="3.5" fill="#047857" />
      <circle cx="88" cy="17.5" r="4.5" fill="#10b981" />
      <!-- Matched Checksum Lines -->
      <rect x="12" y="32" width="92" height="4" rx="2" fill="#059669" opacity="0.75" />
      <rect x="12" y="44" width="76" height="4" rx="2" fill="#047857" opacity="0.5" />
      <rect x="12" y="56" width="86" height="4" rx="2" fill="#059669" opacity="0.75" />
      <rect x="12" y="68" width="64" height="4" rx="2" fill="#047857" opacity="0.5" />
      <!-- Match Status Mini Badge -->
      <rect x="12" y="84" width="44" height="16" rx="4" fill="#059669" />
      <text x="34" y="96" fill="#ffffff" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="800" text-anchor="middle">MATCH</text>
    </g>

    <!-- Front Pocket / Angled Cover -->
    <path d="M 254 232 L 263 200 C 266 191 274 184 284 184 L 410 184 C 422 184 432 194 432 206 L 432 354 C 432 366 422 376 410 376 L 276 376 C 264 376 254 366 254 354 Z"
          fill="url(#emeraldFront)" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Sleek Front Pocket Highlight Reflection -->
    <path d="M 266 200 L 410 186 C 418 186 426 192 428 200 L 430 226 L 260 236 Z"
          fill="#ffffff" opacity="0.12" />
  </g>

  <!-- ==================== CENTRAL COMPARISON LINK & SHIELD ==================== -->
  <!-- Glowing Bridge Beam -->
  <g opacity="0.95">
    <circle cx="256" cy="275" r="75" fill="url(#shieldGlow)" />
    <!-- Transfer / Comparison Pulse Line -->
    <path d="M 180 275 L 332 275" stroke="url(#borderGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" />
  </g>

  <!-- Central Shield Badge -->
  <g filter="url(#shadow)">
    <!-- Hexagonal Security Shield -->
    <path d="M 256 215 
             L 306 238 
             C 306 288 280 326 256 342 
             C 232 326 206 288 206 238 
             Z"
          fill="url(#shieldBg)"
          stroke="url(#shieldBorder)"
          stroke-width="4.5"
          stroke-linejoin="round" />

    <!-- Inner Shield Rim -->
    <path d="M 256 226 
             L 294 244 
             C 294 282 274 313 256 327 
             C 238 313 218 282 218 244 
             Z"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1.2"
          opacity="0.4" />

    <!-- Dynamic Glowing Integrity Checkmark -->
    <path d="M 233 277 L 249 293 L 281 257"
          fill="none"
          stroke="url(#checkGrad)"
          stroke-width="6.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#subtleGlow)" />
  </g>

  <!-- Bit-for-bit Equality Indicator Badge (Bottom Center) -->
  <g transform="translate(186, 404)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="1.5" />
    <circle cx="20" cy="15" r="4" fill="#34d399" />
    <text x="76" y="19" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">BIT-FOR-BIT</text>
  </g>
</svg>
